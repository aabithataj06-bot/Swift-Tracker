<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book Parcel | SwiftTracker</title><link rel="stylesheet" href="css/style.css"></head><body>
<div id="hdr"></div>
<div class="page"><div class="wrap"><h2>Book a parcel</h2><p class="sub">Fill in the details. You will get a Parcel ID to track it. Bookings in this demo are saved in your browser only.</p>
<form id="bookForm" class="card form">
<div><label>Sender name</label><input name="sname" required></div><div><label>Sender email</label><input name="semail" type="email" required></div>
<div><label>Sender phone</label><input name="sphone" required></div><div><label>Pickup city</label><input name="sfrom" required></div>
<div><label>Receiver name</label><input name="rname" required></div><div><label>Receiver email</label><input name="remail" type="email" required></div>
<div><label>Receiver phone</label><input name="rphone" required></div><div><label>Delivery city</label><input name="rto" required></div>
<div class="full"><label>Delivery address</label><textarea name="raddr" rows="2" required></textarea></div>
<div><label>Weight (kg)</label><input name="weight" type="number" min="0.1" step="0.1" value="1" required></div>
<div><label>Service</label><select name="service"><option>Standard</option><option>Express</option><option>Same-day</option></select></div>
<div class="full est" id="est"></div>
<div class="full"><button class="btn" type="submit">Confirm booking</button></div></form>
<div id="confirm"></div></div></div>
<div id="ftr"></div><script src="js/app.js"></script></body></html>
